name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Full validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SymPy oracle
        run: python3 -m pip install sympy==1.12
      - name: Run all checks
        run: zig build check --summary all
